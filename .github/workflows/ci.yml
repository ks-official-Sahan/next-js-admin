name: CI

# NOTE: the app job's `pnpm install` cannot succeed until @sahan-sac/auth-kit
# is published to npm (the template depends on it as "^0.1.0", not a
# workspace/file dependency — see README.md's "Dependencies" section). Until
# then this job fails at the install step; that is expected, not a bug in
# this workflow. The `cli` job is independent of auth-kit and passes on its own.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: admin-template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — lint, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

  variants:
    name: Variant — ${{ matrix.auth }} + ${{ matrix.orm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        auth: [next-auth, better-auth]
        orm: [prisma, drizzle]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # The same step create-admin runs after downloading the template.
      - name: Apply the variant
        run: node cli/apply-variants.mjs --auth ${{ matrix.auth }} --orm ${{ matrix.orm }}

      # The variant changes package.json, so the lockfile is updated, not frozen.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  cli:
    name: CLI — tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install CLI dependencies
        working-directory: cli
        run: npm install

      - name: Run CLI tests
        working-directory: cli
        run: node --test test/*.test.mjs
