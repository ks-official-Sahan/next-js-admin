name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: admin-template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — lint, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

  migrations:
    name: Migrations — both ORMs match schema.prisma
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # Every Prisma migration applied to an empty schema must equal
      # schema.prisma (exit code 2 on any difference).
      - name: Prisma migrations
        env:
          DATABASE_URL: ${{ env.PG }}?schema=public_test
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # The Drizzle migrations must build the same tables: compare the result
      # with schema.prisma too, ignoring only Drizzle's own journal table.
      - name: Drizzle migrations
        env:
          DATABASE_URL: ${{ env.PG }}?schema=admin-panel
        run: |
          psql "$PG" -c 'CREATE SCHEMA IF NOT EXISTS "admin-panel"'
          pnpm exec drizzle-kit migrate
          psql "$PG" -c 'DROP TABLE "admin-panel".__drizzle_migrations'
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  variants:
    name: Variant — ${{ matrix.auth }} + ${{ matrix.orm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        auth: [next-auth, better-auth]
        orm: [prisma, drizzle]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # The same step create-admin runs after downloading the template.
      - name: Apply the variant
        run: node cli/apply-variants.mjs --auth ${{ matrix.auth }} --orm ${{ matrix.orm }}

      # The variant changes package.json, so the lockfile is updated, not frozen.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  cli:
    name: CLI — tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install CLI dependencies
        working-directory: cli
        run: npm install

      - name: Run CLI tests
        working-directory: cli
        run: node --test test/*.test.mjs
